[package]
name = "la-metro-faregate"
version = "0.1.0"
edition = "2021"
description = "Discord bot that removes x.com links"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15"
linkify = "0.11"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "model", "rustls_backend", "cache", "http"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
